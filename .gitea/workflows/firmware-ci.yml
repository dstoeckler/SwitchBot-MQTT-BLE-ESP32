name: Firmware CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  consistency:
    name: Source consistency
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Arduino IDE and PlatformIO sources must match
        run: |
          cmp \
            "Arduino IDE Files/SwitchBot-BLE2MQTT-ESP32.ino" \
            "PlatformIO Files/SwitchBot-BLE2MQTT-ESP32/src/SwitchBot-BLE2MQTT-ESP32.cpp"

      - name: No trailing whitespace in firmware files
        run: |
          ! grep -RIn --exclude-dir=.pio --include='*.cpp' --include='*.ino' --include='*.ini' '[[:blank:]]$' "Arduino IDE Files" "PlatformIO Files"

      - name: Firmware regression tests (Python 3 and g++ required)
        run: python3 -m unittest discover -s tests -v

      - name: Embedded admin assets are current
        run: python3 tools/sync_admin.py --check

  platformio-build:
    name: PlatformIO build matrix
    runs-on: ubuntu-latest
    needs: consistency
    strategy:
      matrix:
        board: [esp32dev, m5stack-atom]
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3 python3-pip python3-venv g++
          rm -rf /var/lib/apt/lists/*

      - name: Install PlatformIO
        run: |
          python3 -m venv /tmp/platformio-venv
          /tmp/platformio-venv/bin/pip install --no-cache-dir platformio==6.1.19

      - name: Build firmware
        working-directory: PlatformIO Files/SwitchBot-BLE2MQTT-ESP32
        run: /tmp/platformio-venv/bin/pio run -e ${{ matrix.board }}

      - name: Configuration codec and rollback tests with installed ArduinoJson
        run: python3 -m unittest discover -s tests -v
